
version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: bugtracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bugtracker
      MYSQL_USER: buguser
      MYSQL_PASSWORD: bugpwd
    ports:
      - "3307:3306"
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: bugtracker-app
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      JDBC_URL: jdbc:mysql://mysql:3306/bugtracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      JDBC_USERNAME: buguser
      JDBC_PASSWORD: bugpwd
    ports:
      - "8080:8080"
    # Optionally mount a custom jdbc-docker.properties if you change credentials
    # volumes:
    #   - ./src/main/resources/jdbc-docker.properties:/usr/local/tomcat/webapps/WEB-INF/classes/jdbc-docker.properties:ro

volumes:
  mysql_data:
